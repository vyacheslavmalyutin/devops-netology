apiVersion: v1
kind: Service
metadata:
  name: svc-nginx-multitool
spec:
  selector:
    app: nginx
  ports:
  - name: http-nginx
    port: 9001
    protocol: TCP
    targetPort: 80
  - name: http-multitool
    port: 9002
    protocol: TCP
    targetPort: 8080
  - name: https-multitool
    port: 11443
    protocol: TCP
    targetPort: 11443