apiVersion: v1
kind: Service
metadata:
  name: svc-np-nginx-multitool
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - name: http-nginx
    port: 9001
    protocol: TCP
    targetPort: 80
    nodePort: 30091
  - name: http-multitool
    port: 9002
    protocol: TCP
    targetPort: 8080
    nodePort: 30092
  - name: https-multitool
    port: 11443
    protocol: TCP
    targetPort: 11443
    nodePort: 30443
